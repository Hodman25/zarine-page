<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid</title>

<style>
    .box{
        width: 100%;
        height: 200px;
        background-color: rgb(82, 234, 6);
        
        /* border-radius: 10px; */

    }
    .parent{
        display:grid;
        grid-template-columns: 300px 300px 300px;
        gap: 30px;

    }
</style>

</head>
<body>
   <div class="parent">
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
   </div> 
</body>
</html>
