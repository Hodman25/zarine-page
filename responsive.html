<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>responsive</title>

<style>
.box{
  background-color: red;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  
}

.parent{
  display: flex;
  justify-content: center;
  gap: 30px;
}
.serv{
  background-color: green;
  width: 300px;
  height: 300px;

}

.service{
  display: grid;
  grid-template-columns: 300px 300px 300px;
  justify-content: center;
  gap: 30px;
  margin-top: 30px;
  margin-bottom: 30px;
}


@media screen and (max-width: 600px){
  .parent{
  
    flex-direction: column;
    align-items: center;

  }
  .service{
    grid-template-columns: 300px;
  }
}

    
</style>


</head>
<body>
  <div class="parent">

    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
  </div> 
    
<div class="service">
  <div class="serv"></div>
  <div class="serv"></div>
  <div class="serv"></div>
</div>


</body>
</html>
